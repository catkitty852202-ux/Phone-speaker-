name: Build Likely Speaker APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi
          unzip "$ZIP_FILE" -d project

      - name: Fix Java and Kotlin JVM Targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "\n}\n",
                  """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """,
                  1
              )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LikelySpeaker-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
